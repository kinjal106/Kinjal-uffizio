<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Uffizio — Design Team KRA</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js">
<style>
:root{
  --bg:#09090f;--bg2:#0f1018;--bg3:#14151f;--bg4:#1c1d2b;--bg5:#252638;
  --border:rgba(255,255,255,0.05);--border2:rgba(255,255,255,0.11);
  --text:#f0f1ff;--text2:#7c80a8;--text3:#3d4060;
  --accent:#7b6ef6;--a2:#00d4aa;--a3:#f7b731;
  --green:#2ecc71;--amber:#f7b731;--red:#e74c3c;--blue:#4fc3f7;
  --sw:230px;--th:56px;
  font-family:"DM Sans",sans-serif;font-size:13px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);min-height:100vh;display:flex}
.sb{width:var(--sw);min-height:100vh;background:var(--bg2);border-right:1px solid var(--border);position:fixed;top:0;left:0;bottom:0;z-index:200;display:flex;flex-direction:column;overflow-y:auto}
.sb-logo{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0}
.sb-icon{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--a2));display:flex;align-items:center;justify-content:center;font-family:"Syne",sans-serif;font-size:13px;font-weight:800;color:#fff}
.sb-title{font-family:"Syne",sans-serif;font-size:13px;font-weight:700;color:var(--text)}
.sb-sub{font-size:10px;color:var(--text3);margin-top:1px}
.sb-nav{padding:12px 8px;flex:1}
.sb-lbl{font-size:9px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.12em;padding:0 8px;margin-bottom:6px;font-family:"Syne",sans-serif}
.sb-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;font-size:12px;color:var(--text2);cursor:pointer;transition:all .15s;margin-bottom:2px;border:none;background:none;width:100%;text-align:left;font-family:"DM Sans",sans-serif}
.sb-item:hover{background:var(--bg4);color:var(--text)}
.sb-item.active{background:rgba(123,110,246,.15);color:var(--accent);font-weight:500}
.sb-item svg{width:14px;height:14px;flex-shrink:0;opacity:.7}
.sb-item.active svg{opacity:1}
.mo-chip{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;border-radius:7px;cursor:pointer;transition:all .15s;margin-bottom:3px;border:1px solid transparent}
.mo-chip:hover{background:var(--bg4)}
.mo-chip.active{background:rgba(123,110,246,.1);border-color:rgba(123,110,246,.25)}
.mo-name{font-size:11px;font-weight:500;color:var(--text2)}
.mo-chip.active .mo-name{color:var(--accent)}
.mo-badge{font-size:9px;background:var(--bg4);border-radius:8px;padding:1px 7px;color:var(--text3)}
.mbr-row{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;cursor:pointer;transition:all .15s;margin-bottom:2px}
.mbr-row:hover{background:var(--bg4)}.mbr-row.active{background:rgba(123,110,246,.1)}
.mbr-av{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;font-family:"Syne",sans-serif}
.mbr-name{font-size:11px;color:var(--text2);flex:1}.mbr-row.active .mbr-name{color:var(--accent)}
.mbr-score{font-size:10px;color:var(--text3);font-family:"JetBrains Mono",monospace}
.main{margin-left:var(--sw);flex:1;display:flex;flex-direction:column;min-height:100vh}
.tb{height:var(--th);background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 22px;gap:10px;position:sticky;top:0;z-index:100;flex-shrink:0}
.tb-title{font-family:"Syne",sans-serif;font-size:14px;font-weight:700;flex:1;color:var(--text);letter-spacing:-.3px}
.tb-sub{font-size:11px;color:var(--text3);font-weight:400;margin-left:6px;font-family:"DM Sans",sans-serif}
.tbtn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:8px;font-size:11px;font-weight:500;cursor:pointer;transition:all .15s;border:1px solid var(--border2);background:transparent;color:var(--text2);font-family:"DM Sans",sans-serif}
.tbtn:hover{background:var(--bg4);color:var(--text)}
.tbtn svg{width:12px;height:12px;flex-shrink:0}
.tbtn-p{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.tbtn-p:hover{opacity:.9;background:var(--accent)}
.tbtn-g{border-color:rgba(46,204,113,.3);color:var(--green)}
.tbtn-g:hover{background:rgba(46,204,113,.08)}
.tbtn-s{border-color:rgba(79,195,247,.3);color:var(--blue)}
.tbtn-s:hover{background:rgba(79,195,247,.08)}
.sync-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;font-size:11px;border:1px solid}
.sync-pill.loading{border-color:rgba(79,195,247,.3);color:var(--blue);background:rgba(79,195,247,.06)}
.sync-pill.ok{border-color:rgba(46,204,113,.3);color:var(--green);background:rgba(46,204,113,.06)}
.sync-pill.err{border-color:rgba(231,76,60,.3);color:var(--red);background:rgba(231,76,60,.06)}
.sync-dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0}
.mo-banner{background:var(--bg3);border-bottom:1px solid var(--border);padding:10px 22px;display:flex;align-items:center;gap:16px;flex-shrink:0}
.mob-month{font-family:"Syne",sans-serif;font-size:16px;font-weight:700;color:var(--text);flex-shrink:0}
.mob-sep{width:1px;height:18px;background:var(--border2);flex-shrink:0}
.mob-stat{text-align:center;flex-shrink:0}
.mob-val{font-size:15px;font-weight:600;color:var(--text);font-family:"Syne",sans-serif}
.mob-lbl{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-top:1px}
.mob-pb-wrap{flex:1;max-width:180px}
.mob-bar{height:5px;background:var(--bg5);border-radius:3px;margin-top:4px;overflow:hidden}
.mob-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--a2));transition:width .5s}
.content{padding:20px 22px;flex:1;overflow-y:auto}
.hidden{display:none!important}
.ov-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.ov-card{background:var(--bg2);border:1px solid var(--border);border-radius:13px;padding:16px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.ov-card:hover{border-color:var(--border2);transform:translateY(-2px)}
.ov-card.active{border-color:var(--accent)}
.ov-stripe{position:absolute;top:0;left:0;right:0;height:2px}
.ov-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;margin-top:4px}
.ov-av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:"Syne",sans-serif;font-size:12px;font-weight:800;flex-shrink:0}
.ov-name{font-family:"Syne",sans-serif;font-size:14px;font-weight:700;color:var(--text)}
.ov-info{font-size:10px;color:var(--text3);margin-top:2px}
.ov-score{font-family:"Syne",sans-serif;font-size:26px;font-weight:800;letter-spacing:-1.5px;margin-left:auto}
.g-badge{display:inline-block;font-size:9px;font-weight:700;padding:2px 8px;border-radius:5px;text-transform:uppercase;letter-spacing:.04em}
.gE{background:rgba(46,204,113,.12);color:var(--green)}
.gM{background:rgba(79,195,247,.12);color:var(--blue)}
.gN{background:rgba(247,183,49,.12);color:var(--amber)}
.gP{background:rgba(231,76,60,.12);color:var(--red)}
.g0{background:var(--bg4);color:var(--text3)}
.kpi-mini{margin-top:10px;display:flex;flex-direction:column;gap:4px}
.km{display:flex;align-items:center;gap:6px;font-size:9px}
.km-lbl{color:var(--text3);width:20px;text-align:right;font-family:"JetBrains Mono",monospace;flex-shrink:0}
.km-bar{flex:1;height:3px;background:var(--bg5);border-radius:2px;overflow:hidden}
.km-fill{height:100%;border-radius:2px}
.km-val{color:var(--text3);width:24px;text-align:right;font-family:"JetBrains Mono",monospace}
.rate-ctrl{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.sel-box{background:var(--bg3);border:1px solid var(--border2);border-radius:8px;padding:6px 10px;font-size:11px;color:var(--text);font-family:"DM Sans",sans-serif;outline:none;cursor:pointer}
.chip{padding:5px 12px;border-radius:20px;font-size:10px;font-weight:500;cursor:pointer;transition:all .15s;border:1px solid var(--border2);color:var(--text2);background:transparent;font-family:"DM Sans",sans-serif}
.chip:hover{color:var(--text);background:var(--bg4)}.chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.tc{background:var(--bg2);border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;transition:border-color .2s}
.tc:hover{border-color:var(--border2)}.tc.rated-full{border-color:rgba(46,204,113,.25)}
.tc-head{padding:12px 14px;display:flex;align-items:flex-start;gap:10px;cursor:pointer;user-select:none}
.tc-num{width:22px;height:22px;border-radius:6px;background:var(--bg4);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;color:var(--text3);flex-shrink:0;margin-top:1px;font-family:"JetBrains Mono",monospace}
.tc-task{font-size:13px;font-weight:500;color:var(--text);line-height:1.4;margin-bottom:5px}
.tc-meta{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.ttag{font-size:9px;padding:2px 7px;border-radius:5px;font-weight:600;white-space:nowrap;text-transform:uppercase;letter-spacing:.04em}
.tH{background:rgba(231,76,60,.1);color:var(--red)}.tM{background:rgba(247,183,49,.1);color:var(--amber)}
.tL{background:rgba(124,128,168,.1);color:var(--text2)}
.tDone{background:rgba(46,204,113,.1);color:var(--green)}.tProg{background:rgba(79,195,247,.1);color:var(--blue)}
.tVer{background:rgba(247,183,49,.1);color:var(--amber)}.tTodo{background:var(--bg4);color:var(--text3)}
.tJira{background:rgba(79,195,247,.08);color:var(--blue);font-family:"JetBrains Mono",monospace;font-size:8px}
.tc-right{display:flex;align-items:center;gap:8px;margin-left:auto;flex-shrink:0}
.sc-pill{font-size:10px;font-weight:600;padding:3px 10px;border-radius:20px;background:var(--bg4);color:var(--text2);font-family:"JetBrains Mono",monospace;white-space:nowrap}
.sc-pill.has{background:rgba(46,204,113,.12);color:var(--green)}
.chevron{color:var(--text3);transition:transform .2s}
.tc.open .chevron{transform:rotate(180deg)}
.kpi-panel{border-top:1px solid var(--border);padding:14px}
.kpi-panel-ttl{font-size:9px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px;font-family:"Syne",sans-serif}
.kpi-panel-sub{font-size:10px;color:var(--text3);margin-bottom:12px}
.kpi-r{display:grid;grid-template-columns:24px 1fr 300px 70px;gap:10px;align-items:start;background:var(--bg3);border-radius:9px;padding:10px 12px;margin-bottom:5px}
.kpi-idx{font-size:10px;font-weight:700;text-align:center;font-family:"JetBrains Mono",monospace;color:var(--text3);margin-top:2px}
.kpi-nm{font-size:11px;font-weight:500;color:var(--text)}
.kpi-desc{font-size:10px;color:var(--text3);margin-top:2px;line-height:1.4}
.band-group{display:flex;gap:3px;flex-wrap:wrap}
.band-btn{padding:3px 7px;border-radius:5px;font-size:9px;font-weight:600;cursor:pointer;border:1px solid var(--border2);background:transparent;color:var(--text3);transition:all .12s;font-family:"JetBrains Mono",monospace}
.band-btn:hover{border-color:var(--accent);color:var(--accent)}
.band-btn.selected{border-color:var(--accent);background:var(--accent);color:#fff}
.kpi-wt{font-size:10px;color:var(--text3);text-align:right;font-family:"JetBrains Mono",monospace;line-height:1.6}
.kpi-wt strong{color:var(--text);font-size:13px;display:block}
.panel-footer{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-top:10px;border-top:1px solid var(--border)}
.note-ta{width:100%;background:var(--bg4);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:11px;color:var(--text);font-family:"DM Sans",sans-serif;resize:none;outline:none;margin-top:10px}
.note-ta:focus{border-color:var(--accent)}.note-ta::placeholder{color:var(--text3)}
.sum-hero{background:var(--bg2);border:1px solid var(--border);border-radius:13px;padding:18px;margin-bottom:14px;display:flex;align-items:center;gap:14px;position:relative;overflow:hidden}
.sum-av{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:"Syne",sans-serif;font-size:16px;font-weight:800;flex-shrink:0}
.sum-sc{font-family:"Syne",sans-serif;font-size:40px;font-weight:800;letter-spacing:-2px;margin-left:auto}
.tbl-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:13px;overflow:hidden;margin-bottom:14px}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:10px;font-weight:600;color:var(--text3);padding:9px 12px;text-align:left;border-bottom:1px solid var(--border);background:var(--bg3);font-family:"Syne",sans-serif;text-transform:uppercase;letter-spacing:.07em}
.tbl td{font-size:11px;color:var(--text2);padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:rgba(255,255,255,.01)}
.tbl .ttl td{background:var(--bg3);color:var(--text);font-weight:600}
.gained-bar{height:4px;background:var(--bg5);border-radius:2px;margin-top:4px;overflow:hidden;width:80px}
.gained-fill{height:100%;border-radius:2px}
.ch-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.ch-card{background:var(--bg2);border:1px solid var(--border);border-radius:13px;padding:16px}
.ch-ttl{font-family:"Syne",sans-serif;font-size:12px;font-weight:700;color:var(--text);margin-bottom:12px}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:1000;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal-box{background:var(--bg2);border:1px solid var(--border2);border-radius:16px;padding:24px;width:460px;max-width:95vw;box-shadow:0 24px 80px rgba(0,0,0,.6)}
.modal-ttl{font-family:"Syne",sans-serif;font-size:16px;font-weight:700;color:var(--text);margin-bottom:18px}
.fg{margin-bottom:10px}
.fg label{font-size:10px;font-weight:600;color:var(--text3);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.07em}
.fg input,.fg select{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:8px;padding:8px 12px;font-size:12px;color:var(--text);font-family:"DM Sans",sans-serif;outline:none}
.fg input:focus,.fg select:focus{border-color:var(--accent)}
.form-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-footer{display:flex;gap:8px;margin-top:18px;justify-content:flex-end}
</style>
</head>
<body>

<aside class="sb">
  <div class="sb-logo">
    <div class="sb-icon">KRA</div>
    <div><div class="sb-title">Uffizio KRA</div><div class="sb-sub">Design Team · FY 2026–27</div></div>
  </div>
  <div class="sb-nav">
    <div style="margin-bottom:18px">
      <div class="sb-lbl">Views</div>
      <button class="sb-item active" id="nav-overview">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
        Month Overview
      </button>
      <button class="sb-item" id="nav-rate">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        Rate KPIs
      </button>
      <button class="sb-item" id="nav-summary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        KRA Summary
      </button>
      <button class="sb-item" id="nav-compare">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        Month Comparison
      </button>
    </div>
    <div>
      <div class="sb-lbl">Select Month</div>
      <div id="moPicker"></div>
    </div>
  </div>
  <div style="padding:10px 8px;border-top:1px solid var(--border)">
    <div class="sb-lbl">Members</div>
    <div id="mbrList"></div>
  </div>
</aside>

<div class="main">
  <header class="tb">
    <div class="tb-title">KRA Dashboard <span class="tb-sub" id="tbSub">/ Month Overview</span></div>
    <div style="display:flex;align-items:center;gap:8px">
      <div id="syncPill" class="sync-pill hidden loading"><div class="sync-dot"></div><span id="syncTxt">Syncing…</span></div>
      <button class="tbtn tbtn-s" id="btn-sync">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
        Sync Sheet
      </button>
      <button class="tbtn tbtn-g" id="btn-export">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Export KRA
      </button>
      <button class="tbtn tbtn-p" id="btn-addtask">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add Task
      </button>
    </div>
  </header>

  <div class="mo-banner" id="moBanner"></div>

  <div class="content">
    <div id="vOverview"><div class="ov-grid" id="ovGrid"></div></div>
    <div id="vRate" class="hidden">
      <div class="rate-ctrl">
        <select class="sel-box" id="mDrop">
          <option>Harshil</option><option>Hinesh</option><option>Mansi</option>
          <option>Vishal</option><option>Mayur</option><option>Kinjal</option>
        </select>
        <button class="chip active" data-filter="All">All</button>
        <button class="chip" data-filter="Done">Done</button>
        <button class="chip" data-filter="In Progress">In Progress</button>
        <button class="chip" data-filter="Verification">Verification</button>
        <button class="chip" data-filter="Todo">Todo</button>
        <span id="rInfo" style="margin-left:auto;font-size:10px;color:var(--text3)"></span>
      </div>
      <div id="taskList"></div>
    </div>
    <div id="vSummary" class="hidden">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap">
        <span style="font-family:'Syne',sans-serif;font-size:14px;font-weight:700">KRA Summary — <span id="sumName" style="color:var(--accent)">—</span></span>
        <select class="sel-box" id="sumDrop">
          <option>Harshil</option><option>Hinesh</option><option>Mansi</option>
          <option>Vishal</option><option>Mayur</option><option>Kinjal</option>
        </select>
      </div>
      <div id="sumContent"></div>
    </div>
    <div id="vCompare" class="hidden">
      <div style="font-family:'Syne',sans-serif;font-size:14px;font-weight:700;margin-bottom:4px">Month-wise Comparison — FY 2026–27</div>
      <div style="font-size:11px;color:var(--text3);margin-bottom:14px">KRA scores across all rated months</div>
      <div class="ch-grid">
        <div class="ch-card"><div class="ch-ttl">KRA Scores by Member</div><div style="height:200px;position:relative"><canvas id="cBar"></canvas></div></div>
        <div class="ch-card"><div class="ch-ttl">KPI Breakdown — Current Month</div><div style="height:200px;position:relative"><canvas id="cRadar"></canvas></div></div>
      </div>
      <div class="tbl-wrap">

// ============================================================
// HELPERS
// ============================================================
function getMember(id) { return MEMBERS.find(m => m.id === id) || MEMBERS[0]; }

function bandToScore(band) {
  if (!band) return 0;
  if (band === "100") return 100;
  const parts = band.split("-");
  return parseInt(parts[1]) || 0;
}

function bandGained(band, weight) {
  return Math.round(bandToScore(band) / 100 * weight * 100) / 100;
}

function taskKraScore(task) {
  if (!task.ratings || Object.keys(task.ratings).length < 10) return null;
  let s = 0;
  KPIs.forEach(k => { s += bandGained(task.ratings[k.id] || "", k.weight); });
  return Math.round(s * 10) / 10;
}

function ratingInfo(score) {
  if (score === null) return {label: "Not rated", cls: "g0"};
  if (score >= 85) return {label: "Exceeds Expectations", cls: "gE"};
  if (score >= 70) return {label: "Meets Expectations", cls: "gM"};
  if (score >= 50) return {label: "Needs Improvement", cls: "gN"};
  return {label: "Poor Performance", cls: "gP"};
}

function mKpiAvgScores(mid, mo) {
  const mt = tasks.filter(t => t.assignee === mid && t.month === mo && Object.keys(t.ratings || {}).length === 10);
  if (!mt.length) return KPIs.map(() => null);
  return KPIs.map(k => {
    const vals = mt.map(t => bandToScore(t.ratings[k.id] || "")).filter(v => v > 0);
    return vals.length ? Math.round(vals.reduce((a,b) => a+b, 0) / vals.length) : null;
  });
}

function mScore(mid, mo) {
  const mt = tasks.filter(t => t.assignee === mid && t.month === mo && Object.keys(t.ratings || {}).length === 10);
  if (!mt.length) return null;
  const scores = mt.map(t => taskKraScore(t)).filter(s => s !== null);
  if (!scores.length) return null;
  return Math.round(scores.reduce((a,b) => a+b, 0) / scores.length * 10) / 10;
}

function monthLabel(m) {
  if (!m) return "";
  try {
    return new Date(m + "-01").toLocaleDateString("en-IN", {month:"long", year:"numeric"});
  } catch(e) { return m; }
}

function allMonths() {
  const ms = {};
  tasks.forEach(t => { if (t.month) ms[t.month] = (ms[t.month] || 0) + 1; });
  return Object.entries(ms).sort((a,b) => a[0].localeCompare(b[0]));
}

function statusTag(s) {
  const map = {"Done":"tDone","In Progress":"tProg","Verification":"tVer","Todo":"tTodo"};
  return '<span class="ttag ' + (map[s] || "tTodo") + '">' + s + '</span>';
}
function priorityTag(p) {
  return '<span class="ttag ' + (p==="High"?"tH":p==="Low"?"tL":"tM") + '">' + p + '</span>';
}

// ============================================================
// STORAGE
// ============================================================
function saveRatings() {
  const out = {};
  tasks.forEach(t => {
    if (Object.keys(t.ratings || {}).length > 0) {
      out[t.id] = {r: t.ratings, n: t.note || ""};
    }
  });
  try { localStorage.setItem("kraRatings_v4", JSON.stringify(out)); } catch(e) {}
}

function loadRatings() {
  try {
    const saved = localStorage.getItem("kraRatings_v4");
    if (!saved) return;
    const ratings = JSON.parse(saved);
    tasks.forEach(t => {
      if (ratings[t.id]) {
        t.ratings = ratings[t.id].r || {};
        t.note = ratings[t.id].n || "";
      }
    });
  } catch(e) {}
}

  tasks = JSON.parse(JSON.stringify(SEED_TASKS));
  loadRatings();
  nextId = Math.max(...tasks.map(t => t.id)) + 1;

  // Wire up all buttons using addEventListener — no onclick in HTML
  document.getElementById("nav-overview").addEventListener("click", () => setView("overview"));
  document.getElementById("nav-rate").addEventListener("click", () => setView("rate"));
  document.getElementById("nav-summary").addEventListener("click", () => setView("summary"));
  document.getElementById("nav-compare").addEventListener("click", () => setView("compare"));

  document.getElementById("btn-sync").addEventListener("click", syncSheet);

  document.getElementById("btn-addtask").addEventListener("click", openModal);
  document.getElementById("btn-cancel").addEventListener("click", closeModal);
  document.getElementById("btn-save-task").addEventListener("click", saveNewTask);

  document.getElementById("mDrop").addEventListener("change", function() {
    curMember = this.value;
    buildRate();
    buildMbrList();
  });

  document.getElementById("sumDrop").addEventListener("change", function() {
    curSumMember = this.value;
    buildSummary();
  });

  // Filter chips
  document.querySelectorAll("[data-filter]").forEach(btn => {

  buildMoPicker();

  buildBanner();
  buildOverview();

// ============================================================
// MONTH PICKER
// ============================================================
function buildMoPicker() {
  const wrap = document.getElementById("moPicker");
  const months = allMonths();
  if (!months.find(([m]) => m === curMonth) && months.length) curMonth = months[0][0];
  wrap.innerHTML = "";
  months.forEach(([m, cnt]) => {
    const div = document.createElement("div");
    div.className = "mo-chip" + (curMonth === m ? " active" : "");
    div.innerHTML =
      '<span class="mo-name">' + monthLabel(m) + '</span>' +
      '<span class="mo-badge">' + cnt + '</span>';
    div.addEventListener("click", function() {
      curMonth = m;
      buildMoPicker();
      buildBanner();
      buildMbrList();
      if (curView === "overview") buildOverview();
      if (curView === "rate") buildRate();
      if (curView === "summary") buildSummary();
    });
    wrap.appendChild(div);
  });
}

// ============================================================
// BANNER
// ============================================================
function buildBanner() {
  const mt = tasks.filter(t => t.month === curMonth);
  const rated = mt.filter(t => taskKraScore(t) !== null).length;
  const pct = mt.length ? Math.round(rated / mt.length * 100) : 0;
  const scs = MEMBERS.map(m => mScore(m.id, curMonth)).filter(s => s !== null);
  const avg = scs.length ? Math.round(scs.reduce((a,b) => a+b, 0) / scs.length * 10) / 10 : null;
  const ri = avg !== null ? ratingInfo(avg) : {label:"Not rated", cls:"g0"};
  const colMap = {gE:"var(--green)", gM:"var(--blue)", gN:"var(--amber)", gP:"var(--red)", g0:"var(--text3)"};

  document.getElementById("moBanner").innerHTML =
    '<div class="mob-month">' + monthLabel(curMonth) + '</div>' +
    '<div class="mob-sep"></div>' +
    '<div class="mob-stat"><div class="mob-val">' + mt.length + '</div><div class="mob-lbl">Tasks</div></div>' +
    '<div class="mob-sep"></div>' +
    '<div class="mob-stat"><div class="mob-val">' + rated + '</div><div class="mob-lbl">KRA Rated</div></div>' +
    '<div class="mob-sep"></div>' +
    '<div class="mob-stat"><div class="mob-val" style="color:var(--accent)">' + (avg !== null ? avg : "—") + '</div><div class="mob-lbl">Avg Score</div></div>' +
    '<div class="mob-sep"></div>' +
    '<div class="mob-stat"><div class="mob-val" style="color:' + colMap[ri.cls] + ';font-size:12px">' + ri.label + '</div><div class="mob-lbl">Team Rating</div></div>' +
    '<div class="mob-pb-wrap"><div style="font-size:9px;color:var(--text3);display:flex;justify-content:space-between"><span>Progress</span><span style="color:var(--accent)">' + pct + '%</span></div>' +
    '<div class="mob-bar"><div class="mob-fill" style="width:' + pct + '%"></div></div></div>';
}

function buildMbrList() {
  const wrap = document.getElementById("mbrList");
  wrap.innerHTML = "";
  MEMBERS.forEach(m => {
    const sc = mScore(m.id, curMonth);
    const div = document.createElement("div");
    div.className = "mbr-row" + (curMember === m.id ? " active" : "");
    div.innerHTML =
      '<div class="mbr-av" style="background:' + m.bg + ';color:' + m.c + '">' + m.av + '</div>' +
      '<span class="mbr-name">' + m.id + '</span>' +
      '<span class="mbr-score">' + (sc !== null ? sc.toFixed(1) : "—") + '</span>';
    div.addEventListener("click", function() {
      curMember = m.id;
      setView("rate");
    });
    wrap.appendChild(div);
  });
}

function setView(v) {
  curView = v;
  ["vOverview","vRate","vSummary","vCompare"].forEach(id => document.getElementById(id).classList.add("hidden"));
  const map = {overview:"vOverview", rate:"vRate", summary:"vSummary", compare:"vCompare"};
  document.getElementById(map[v]).classList.remove("hidden");

  document.querySelectorAll(".sb-item").forEach(el => el.classList.remove("active"));
  const navEl = document.getElementById("nav-" + v);
  if (navEl) navEl.classList.add("active");

  const subs = {overview:"/ Month Overview", rate:"/ Rate KPIs", summary:"/ KRA Summary", compare:"/ Month Comparison"};
  document.getElementById("tbSub").textContent = subs[v] || "";

  if (v === "overview") buildOverview();
  if (v === "rate") buildRate();
  if (v === "summary") buildSummary();
  if (v === "compare") buildCompare();
}

    });

    card.innerHTML =
      '<div class="ov-stripe" style="background:' + m.bc + '"></div>' +
      '<div class="ov-head">' +
        '<div class="ov-av" style="background:' + m.bg + ';color:' + m.c + '">' + m.av + '</div>' +
        '<div><div class="ov-name">' + m.id + '</div><div class="ov-info">' + mt.length + ' tasks · ' + rc + ' rated</div></div>' +
        '<div class="ov-score" style="color:' + m.bc + '">' + (sc !== null ? sc.toFixed(1) : "—") + '</div>' +
      '</div>' +
      '<span class="g-badge ' + ri.cls + '">' + ri.label + '</span>' +
      '<div class="kpi-mini">' + kpiMiniHtml + '</div>' +
      '<div style="font-size:10px;color:var(--text3);margin-top:8px">Click to rate tasks →</div>';

    card.addEventListener("click", function() {
      curMember = m.id;
      setView("rate");
    });
    grid.appendChild(card);
  });
}

// ============================================================
// RATE TASKS
// ============================================================
function buildRate() {
  document.getElementById("mDrop").value = curMember;
  buildMbrList();

  let mt = tasks.filter(t => t.assignee === curMember && t.month === curMonth);
  const total = mt.length;
  const rated = mt.filter(t => taskKraScore(t) !== null).length;
  if (curFilter !== "All") mt = mt.filter(t => t.status === curFilter);
  document.getElementById("rInfo").textContent = monthLabel(curMonth) + " · " + total + " tasks · " + rated + " fully rated";

  const wrap = document.getElementById("taskList");
  if (!mt.length) {
    wrap.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text3);font-size:12px">No tasks for <strong style="color:var(--text)">' + curMember + '</strong> in ' + monthLabel(curMonth) + (curFilter !== "All" ? " · filter: " + curFilter : "") + '</div>';
    return;
  }

  wrap.innerHTML = "";
  mt.forEach((task, idx) => {
    const sc = taskKraScore(task);
    const isOpen = openTaskId === task.id;
    const fullyRated = Object.keys(task.ratings || {}).length === 10;
    const ri = ratingInfo(sc);

    const div = document.createElement("div");
    div.className = "tc" + (fullyRated ? " rated-full" : "") + (isOpen ? " open" : "");
    div.id = "tc-" + task.id;

    const dateStr = task.start ? task.start + (task.end && task.end !== task.start ? " → " + task.end : "") : "";
    const jiraStr = task.jira ? '<span class="ttag tJira">' + task.jira + '</span>' : "";

    div.innerHTML =
      '<div class="tc-head" data-taskid="' + task.id + '">' +
        '<div class="tc-num">' + (idx+1) + '</div>' +
        '<div style="flex:1">' +
          '<div class="tc-task">' + task.task + '</div>' +
          '<div class="tc-meta">' + priorityTag(task.priority) + statusTag(task.status) +
            (dateStr ? '<span class="ttag tTodo" style="font-family:'JetBrains Mono',monospace;font-size:9px">' + dateStr + '</span>' : "") +
            jiraStr +
          '</div>' +
        '</div>' +
        '<div class="tc-right">' +
          '<span class="g-badge ' + ri.cls + '">' + ri.label + '</span>' +
          '<span class="sc-pill' + (sc !== null ? " has" : "") + '">' + (sc !== null ? sc.toFixed(1) + "/100" : "Rate KPIs") + '</span>' +
          '<svg class="chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>' +
        '</div>' +
      '</div>';

    if (isOpen) {
      div.appendChild(buildKpiPanel(task));
    }

    div.querySelector(".tc-head").addEventListener("click", function() {
      const tid = parseInt(this.dataset.taskid);
      openTaskId = openTaskId === tid ? null : tid;
      buildRate();
    });

    wrap.appendChild(div);
  });
}

// ============================================================
// KPI PANEL
// ============================================================
function buildKpiPanel(task) {
  const panel = document.createElement("div");
  panel.className = "kpi-panel";

  let rowsHtml = '<div class="kpi-panel-ttl">Rate all 10 KPIs</div>' +
    '<div class="kpi-panel-sub">Select a score band (0-9 to 100) for each KPI. Score auto-converts to weighted points.</div>';

  KPIs.forEach((k, i) => {
    const cur = (task.ratings || {})[k.id] || "";
    let bandBtns = "";
    BANDS.forEach(b => {
      bandBtns += '<button class="band-btn' + (cur === b ? " selected" : "") + '" data-taskid="' + task.id + '" data-kpiid="' + k.id + '" data-band="' + b + '">' + b + '</button>';
    });
    const gained = cur ? bandGained(cur, k.weight) : 0;

    rowsHtml +=
      '<div class="kpi-r">' +
        '<div class="kpi-idx" style="color:' + KC[i] + '">' + k.id + '</div>' +
        '<div><div class="kpi-nm">' + k.name + '</div><div class="kpi-desc">' + k.desc + '</div></div>' +
        '<div class="band-group">' + bandBtns + '</div>' +
        '<div class="kpi-wt"><strong>' + k.weight + '</strong>pts' + (cur ? '<br><span style="color:var(--green)">+' + gained + '</span>' : '<br><span style="color:var(--text3)">—</span>') + '</div>' +
      '</div>';
  });

  const sc = taskKraScore(task);
  const ratedCount = Object.keys(task.ratings || {}).length;
  const ri = ratingInfo(sc);

  rowsHtml +=
    '<textarea class="note-ta" rows="2" placeholder="Team lead comment for this task (optional)…" data-taskid="' + task.id + '">' + (task.note || "") + '</textarea>' +
    '<div class="panel-footer">' +
      '<div style="color:var(--text2);font-size:12px">' + ratedCount + '/10 KPIs rated · Score: ' +
        '<strong style="font-family:'JetBrains Mono',monospace;font-size:15px;color:' + (sc !== null ? 'var(--green)' : 'var(--text3)') + '">' + (sc !== null ? sc.toFixed(1) : "—") + '</strong>/100 · ' +
        '<span class="g-badge ' + ri.cls + '">' + ri.label + '</span>' +
      '</div>' +
      (ratedCount === 10 ? '<span class="g-badge gE">✓ Fully rated</span>' : '<span style="font-size:10px;color:var(--text3)">Rate all 10 to finalize</span>') +
    '</div>';

  panel.innerHTML = rowsHtml;

  // Band button events
  panel.querySelectorAll(".band-btn").forEach(btn => {
    btn.addEventListener("click", function(e) {
      e.stopPropagation();
      const taskId = parseInt(this.dataset.taskid);
      const kpiId = parseInt(this.dataset.kpiid);
      const band = this.dataset.band;
      const t = tasks.find(x => x.id === taskId);
      if (!t) return;
      if (!t.ratings) t.ratings = {};
      t.ratings[kpiId] = band;
      saveRatings();
      // Push to sheet
      const sc = taskKraScore(t);
      if (SCRIPT_URL) {
        const payload = {action:"saveRatings", rowId:t.id, score:sc||0, note:t.note||"", assignee:t.assignee, task:t.task, month:t.month};
        KPIs.forEach(k => { payload["r"+k.id] = t.ratings[k.id] || ""; });
        fetch(SCRIPT_URL, {method:"POST", mode:"cors", headers:{"Content-Type":"application/json"}, body:JSON.stringify(payload)}).catch(() => {});
      }
      // Refresh panel in place
      const card = document.getElementById("tc-" + taskId);
      if (card) {
        const oldPanel = card.querySelector(".kpi-panel");
        if (oldPanel) oldPanel.remove();
        card.appendChild(buildKpiPanel(t));
        // Update score pill
        const pill = card.querySelector(".sc-pill");
        const newSc = taskKraScore(t);
        if (pill) {
          pill.textContent = newSc !== null ? newSc.toFixed(1) + "/100" : "Rate KPIs";
          pill.className = "sc-pill" + (newSc !== null ? " has" : "");
        }
        if (Object.keys(t.ratings || {}).length === 10) card.classList.add("rated-full");
      }
      buildBanner();
      buildMbrList();
    });
  });

  // Note textarea event
  const textarea = panel.querySelector(".note-ta");
  if (textarea) {
    textarea.addEventListener("change", function() {
      const taskId = parseInt(this.dataset.taskid);
      const t = tasks.find(x => x.id === taskId);
      if (t) { t.note = this.value; saveRatings(); }
    });
  }

  return panel;
}

// ============================================================
// KRA SUMMARY
// ============================================================
function buildSummary() {
  const curS = document.getElementById("sumDrop").value;
  curSumMember = curS;
  document.getElementById("sumName").textContent = curSumMember + " · " + monthLabel(curMonth);

  const M = getMember(curSumMember);
  const sc = mScore(curSumMember, curMonth);
  const ri = sc !== null ? ratingInfo(sc) : {label:"Not yet rated", cls:"g0"};
  const mt = tasks.filter(t => t.assignee === curSumMember && t.month === curMonth);
  const ratedTasks = mt.filter(t => taskKraScore(t) !== null);
  const avgs = mKpiAvgScores(curSumMember, curMonth);

  let kpiRows = "";
  KPIs.forEach((k, i) => {
    const avg = avgs[i];
    const gained = avg !== null ? Math.round(avg / 100 * k.weight * 100) / 100 : null;
    kpiRows +=
      '<tr>' +
        '<td style="color:var(--text3);font-family:'JetBrains Mono',monospace">' + k.id + '</td>' +
        '<td><strong style="color:var(--text)">' + k.name + '</strong><div style="font-size:10px;color:var(--text3);margin-top:2px">' + k.desc + '</div></td>' +
        '<td style="font-family:'JetBrains Mono',monospace;color:var(--text3)">' + k.target + '%</td>' +
        '<td style="font-family:'JetBrains Mono',monospace;font-weight:600;color:var(--text)">' + k.weight + '</td>' +
        '<td>' + (avg !== null ? '<span style="font-family:'JetBrains Mono',monospace;font-weight:600;color:var(--text)">' + avg + '</span><span style="color:var(--text3)">/100</span><div class="gained-bar"><div class="gained-fill" style="width:' + avg + '%;background:' + KC[i] + '"></div></div>' : '<span style="color:var(--text3)">—</span>') + '</td>' +
        '<td style="font-family:'JetBrains Mono',monospace;font-weight:600;color:' + (gained !== null ? 'var(--green)' : 'var(--text3)') + '">' + (gained !== null ? gained : "—") + '<span style="color:var(--text3);font-weight:400">/' + k.weight + '</span></td>' +
      '</tr>';
  });

  let taskRows = "";
  mt.forEach((t, i) => {
    const tsc = taskKraScore(t);
    const done = Object.keys(t.ratings || {}).length;
    const tri = tsc !== null ? ratingInfo(tsc) : {label:"—", cls:"g0"};
    taskRows +=
      '<tr>' +
        '<td style="color:var(--text3)">' + (i+1) + '</td>' +
        '<td style="max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)">' + t.task + '</td>' +
        '<td>' + statusTag(t.status) + '</td>' +
        '<td style="font-family:'JetBrains Mono',monospace;color:' + (done===10?'var(--green)':'var(--amber)') + '">' + done + '/10</td>' +
        '<td style="font-family:'JetBrains Mono',monospace;font-weight:600;color:' + (tsc!==null?'var(--green)':'var(--text3)') + '">' + (tsc!==null?tsc.toFixed(1):"—") + '</td>' +
        '<td><span class="g-badge ' + tri.cls + '">' + tri.label + '</span></td>' +
        '<td style="font-size:10px;color:var(--text3)">' + (t.note || "—") + '</td>' +
      '</tr>';
  });

  document.getElementById("sumContent").innerHTML =
    '<div class="sum-hero">' +
      '<div style="position:absolute;top:0;left:0;right:0;height:2px;background:' + M.bc + '"></div>' +
      '<div class="sum-av" style="background:' + M.bg + ';color:' + M.c + '">' + M.av + '</div>' +
      '<div>' +
        '<div style="font-family:'Syne',sans-serif;font-size:16px;font-weight:700">' + curSumMember + '</div>' +
        '<div style="font-size:11px;color:var(--text3);margin-top:3px">' + monthLabel(curMonth) + ' · ' + mt.length + ' tasks · ' + ratedTasks.length + ' rated</div>' +
        '<span class="g-badge ' + ri.cls + '" style="margin-top:8px;display:inline-block">' + ri.label + '</span>' +
      '</div>' +
      '<div style="margin-left:auto;text-align:right">' +
        '<div class="sum-sc" style="color:' + M.bc + '">' + (sc!==null?sc.toFixed(1):"—") + '</div>' +
        '<div style="font-size:11px;color:var(--text3)">/ 100</div>' +
      '</div>' +
    '</div>' +
    '<div class="tbl-wrap"><table class="tbl">' +
      '<thead><tr><th>#</th><th>KPI</th><th>Target</th><th>Weight</th><th>Avg Score</th><th>Gained</th></tr></thead>' +
      '<tbody>' + kpiRows +
        '<tr class="ttl"><td colspan="3">Total KRA Score — ' + monthLabel(curMonth) + '</td><td>100</td><td><span class="g-badge ' + ri.cls + '">' + ri.label + '</span></td>' +
        '<td style="font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:700;color:' + (sc!==null?'var(--green)':'var(--text3)') + '">' + (sc!==null?sc.toFixed(1):"—") + '<span style="font-size:11px;color:var(--text3);font-weight:400">/100</span></td></tr>' +
      '</tbody>' +
    '</table></div>' +
    '<div class="tbl-wrap">' +
      '<div style="padding:12px 14px;border-bottom:1px solid var(--border);font-family:'Syne',sans-serif;font-size:12px;font-weight:700">Task-level scores — ' + monthLabel(curMonth) + '</div>' +
      '<table class="tbl"><thead><tr><th>#</th><th>Task</th><th>Status</th><th>KPIs</th><th>Score</th><th>Rating</th><th>Comment</th></tr></thead>' +
      '<tbody>' + taskRows + '</tbody></table>' +
    '</div>';

// ============================================================
// COMPARISON
// ============================================================
function buildCompare() {
  const months = allMonths().map(([m]) => m);
  if (charts.bar) charts.bar.destroy();
  charts.bar = new Chart(document.getElementById("cBar"), {
    type: "bar",
    data: {
      labels: MEMBERS.map(m => m.id),
      datasets: months.map(mo => ({
        label: monthLabel(mo),
        data: MEMBERS.map(m => mScore(m.id, mo) || 0),
        backgroundColor: MEMBERS.map(m => m.bc + "55"),
        borderColor: MEMBERS.map(m => m.bc),
        borderWidth: 2, borderRadius: 5
      }))
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {legend: {labels: {color:"#7c80a8", font:{size:10}}}},
      scales: {
        x: {grid:{color:"rgba(255,255,255,.04)"}, ticks:{color:"#7c80a8",font:{size:10}}},
        y: {grid:{color:"rgba(255,255,255,.04)"}, ticks:{color:"#7c80a8",font:{size:10}}, min:0, max:100}
      }
    }
  });

  const teamAvgs = KPIs.map((k, i) => {
    const vals = MEMBERS.map(m => mKpiAvgScores(m.id, curMonth)[i]).filter(v => v !== null && v > 0);
    return vals.length ? Math.round(vals.reduce((a,b) => a+b, 0) / vals.length) : 0;
  });

  if (charts.radar) charts.radar.destroy();
  charts.radar = new Chart(document.getElementById("cRadar"), {
    type: "radar",
    data: {
      labels: KPIs.map(k => "K"+k.id+" ("+k.weight+"pt)"),
      datasets: [{label:"Team avg", data:teamAvgs, backgroundColor:"rgba(123,110,246,.15)", borderColor:"#7b6ef6", borderWidth:2, pointBackgroundColor:"#7b6ef6", pointRadius:3}]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {legend:{display:false}},
      scales: {r: {grid:{color:"rgba(255,255,255,.07)"}, ticks:{display:false}, pointLabels:{color:"#7c80a8",font:{size:9}}, min:0, max:100}}
    }
  });

  const tbl = document.getElementById("cmpTbl");
  let html = "<thead><tr><th>Member</th>" + months.map(m => "<th>" + monthLabel(m) + "</th>").join("") + "<th>Best Month</th></tr></thead><tbody>";
  MEMBERS.forEach(m => {
    const scs = months.map(mo => mScore(m.id, mo));
    const validScs = scs.filter(s => s !== null);
    const best = validScs.length ? Math.max(...validScs) : null;
    const bi = best !== null ? scs.indexOf(best) : -1;
    const M = getMember(m.id);
    html += "<tr><td><div style='display:flex;align-items:center;gap:8px'><div class='mbr-av' style='width:22px;height:22px;background:" + M.bg + ";color:" + M.c + ";font-size:9px'>" + M.av + "</div>" + m.id + "</div></td>";
    scs.forEach(sc => {
      const ri = sc !== null ? ratingInfo(sc) : {label:"—", cls:"g0"};
      html += "<td style='font-family:"JetBrains Mono",monospace'>" + (sc !== null ? "<strong style='color:" + M.bc + "'>" + sc.toFixed(1) + "</strong><br><span class='g-badge " + ri.cls + "' style='font-size:8px'>" + ri.label + "</span>" : "<span style='color:var(--text3)'>—</span>") + "</td>";
    });
    html += "<td style='color:var(--amber);font-weight:600;font-size:11px'>" + (best !== null ? monthLabel(months[bi]) : "—") + "</td></tr>";
  });
  html += "</tbody>";
  tbl.innerHTML = html;
}

// ============================================================
// SYNC
// ============================================================
function showSync(state, msg) {
  const el = document.getElementById("syncPill");
  el.className = "sync-pill " + state;
  el.classList.remove("hidden");
  document.getElementById("syncTxt").textContent = msg;
}

function syncSheet() {
  if (!SCRIPT_URL) { showSync("err", "No Sheet URL set"); return; }
  showSync("loading", "Syncing from Google Sheet…");

  // Use JSONP to bypass CORS completely — works from any domain including Vercel
  const cbName = "kraCallback_" + Date.now();
  const script = document.createElement("script");
  script.src = SCRIPT_URL + "?action=getTasks&callback=" + cbName + "&t=" + Date.now();

  window[cbName] = function(data) {
    // Clean up
    delete window[cbName];
    document.head.removeChild(script);

    if (data.error) { showSync("err", "Sheet error: " + data.error); return; }
    if (!data.tasks || !data.tasks.length) { showSync("err", "No tasks returned"); return; }

    // Merge: keep existing ratings & notes
    data.tasks.forEach(st => {
      const ex = tasks.find(t => t.id === st.id);
      st.ratings = (ex && Object.keys(ex.ratings||{}).length > 0) ? ex.ratings : (st.ratings || {});
      st.note = (ex && ex.note) ? ex.note : (st.note || "");
    });
    // Keep any locally-added tasks not yet in sheet
    tasks.forEach(lt => { if (!data.tasks.find(t => t.id === lt.id)) data.tasks.push(lt); });
    tasks = data.tasks;
    nextId = Math.max(...tasks.map(t => t.id)) + 1;
    saveRatings();
    buildMoPicker(); buildBanner(); buildMbrList();
    if (curView === "overview") buildOverview();
    if (curView === "rate") buildRate();
    if (curView === "summary") buildSummary();
    showSync("ok", "✓ Synced " + tasks.length + " tasks from Google Sheet");
    setTimeout(() => document.getElementById("syncPill").classList.add("hidden"), 5000);
  };

  script.onerror = function() {
    delete window[cbName];
    document.head.removeChild(script);
    showSync("err", "Sync failed — check Apps Script deployment");
    setTimeout(() => document.getElementById("syncPill").classList.add("hidden"), 5000);
  };

  document.head.appendChild(script);
  // Timeout fallback
  setTimeout(() => {
    if (window[cbName]) {
      delete window[cbName];
      showSync("err", "Sync timeout — check Apps Script");
      setTimeout(() => document.getElementById("syncPill").classList.add("hidden"), 5000);
    }
  }, 10000);
}

// ============================================================
// ADD TASK MODAL
// ============================================================
function openModal() {
  document.getElementById("ntMbr").value = curMember;
  document.getElementById("modalOverlay").classList.add("open");
}
function closeModal() {
  document.getElementById("modalOverlay").classList.remove("open");
}
function saveNewTask() {
  const name = document.getElementById("ntName").value.trim();
  if (!name) { alert("Please enter a task name."); return; }
  const start = document.getElementById("ntStart").value;
  const month = start ? start.substring(0, 7) : curMonth;
  const t = {
    id: nextId++,
    task: name,
    assignee: document.getElementById("ntMbr").value,
    priority: document.getElementById("ntPri").value,
    start: start,
    end: document.getElementById("ntEnd").value,
    jira: document.getElementById("ntJira").value.trim(),
    status: document.getElementById("ntStat").value,
    month: month,
    monthLabel: monthLabel(month),
    ratings: {}, note: ""
  };
  tasks.push(t);
  saveRatings();
  if (SCRIPT_URL) {
    fetch(SCRIPT_URL, {method:"POST", mode:"cors", headers:{"Content-Type":"application/json"}, body:JSON.stringify({action:"addTask", ...t})}).catch(() => {});
  }
  closeModal();
  ["ntName","ntStart","ntEnd","ntJira"].forEach(id => { document.getElementById(id).value = ""; });
  curMember = t.assignee;
  curMonth = month;
  buildMoPicker(); buildBanner(); buildMbrList();
  setView("rate");
}

// ============================================================
// EXPORT CSV
// ============================================================
function exportCSV() {
  const months = allMonths().map(([m]) => m);
  let csv = "Member,Month,Task,Status,Jira,Priority," +
    KPIs.map(k => "KPI" + k.id + "_Band").join(",") + "," +
    KPIs.map(k => "KPI" + k.id + "_Gained").join(",") +
    ",Total_Score,Rating,Comment\n";

  tasks.forEach(t => {
    const sc = taskKraScore(t);
    const ri = sc !== null ? ratingInfo(sc).label : "";
    csv += '"' + t.assignee + '","' + monthLabel(t.month) + '","' + t.task.replace(/"/g,'""') + '","' + t.status + '","' + (t.jira||"") + '","' + t.priority + '",' +
      KPIs.map(k => t.ratings?.[k.id] || "").join(",") + "," +
      KPIs.map(k => t.ratings?.[k.id] ? bandGained(t.ratings[k.id], k.weight) : "").join(",") + "," +
      (sc !== null ? sc : "") + ',"' + ri + '","' + (t.note||"").replace(/"/g,'""') + '"\n';
  });

  csv += "\n\nMONTH-WISE KRA SUMMARY\nMember,Month," +
    KPIs.map(k => k.short + "_Avg").join(",") + ",KRA_Score,Rating\n";

  MEMBERS.forEach(m => {
    months.forEach(mo => {
      const avgs = mKpiAvgScores(m.id, mo).map(v => v !== null ? v : "").join(",");
      const sc = mScore(m.id, mo);
      csv += '"' + m.id + '","' + monthLabel(mo) + '",' + avgs + "," +
        (sc !== null ? sc : "—") + ',"' + (sc !== null ? ratingInfo(sc).label : "—") + '"\n';
    });
  });

  const blob = new Blob([csv], {type:"text/csv"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "KRA_Design_" + new Date().toISOString().slice(0,7) + ".csv";
  a.click();
  URL.revokeObjectURL(a.href);
}
